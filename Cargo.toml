[workspace]

[package]
name = "magnetar-provider-metal"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Apple Metal Provider for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-provider-Metal"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["science", "hardware-support"]
rust-version = "1.98"

[dependencies]
# `path` resolves inside a checkout of the parent Magnetar repository;
# `version` is what `cargo publish` records for crates.io consumers.
magnetar-core = { version = "1.0.0", path = "../../magnetar-core" }
magnetar-provider-api = { version = "1.0.0", path = "../../magnetar-provider-api" }
